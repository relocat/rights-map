#
# Unit tests, the data validator and the static browser test on every pull
# request and on pushes to main. Actions are pinned to full commit SHAs.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned dev dependencies
        run: |
          npm ci --ignore-scripts --prefix tools
          npm ci --ignore-scripts --prefix scripts/test-web-e2e
      - name: Unit tests
        run: node --test 'tests/js/**/*.test.mjs'
      - name: Validate the data
        run: node tools/validate.mjs --root .
      - name: Install the browser
        run: npx --prefix scripts/test-web-e2e playwright install --with-deps chromium
      - name: Static browser test
        run: bash scripts/test-rights-map-browser.sh
