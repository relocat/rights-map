#
# REUSE compliance (https://reuse.software): every file has a licence and a
# copyright holder, from its own header or from REUSE.toml. The tool is
# installed from PyPI at an exact version in a throwaway virtual environment.
# The checkout action is pinned to a full commit SHA.
name: REUSE

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REUSE_VERSION: '6.2.0'

jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install reuse
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse-venv"
          "$RUNNER_TEMP/reuse-venv/bin/pip" install --disable-pip-version-check "reuse==${REUSE_VERSION}"
      - name: Lint
        run: '"$RUNNER_TEMP/reuse-venv/bin/reuse" lint'
